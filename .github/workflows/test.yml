name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start database services
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_db_test hauspet_redis_test hauspet_audit_db_test

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for database to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.test.yaml ps | grep -q "hauspet_db_test.*healthy"; then
              echo "Database is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Database failed to become healthy"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_db_test
              exit 1
            fi
            echo "Database not ready, waiting... (Attempt $i/30)"
            sleep 2
          done

      - name: Start API service (with migrations)
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_api_test

      - name: Check API container status
        run: |
          echo "Waiting 10 seconds for container to initialize..."
          sleep 10
          echo "=== Container Status ==="
          docker compose -f docker/docker-compose.test.yaml ps hauspet_api_test
          echo "=== Initial API Logs (first 100 lines) ==="
          docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test | head -100

      - name: Wait for API to be ready
        run: |
          set +e  # Disable exit on error - we handle errors explicitly
          echo "Waiting for API to be ready (allowing up to 5 minutes)..."

          ATTEMPT=0
          MAX_ATTEMPTS=150
          READY=false

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            ELAPSED=$((ATTEMPT * 2))

            # Try to reach the API with timeouts
            curl --connect-timeout 5 --max-time 10 -f -s -o /dev/null http://localhost:3000/api/breeds 2>/dev/null
            CURL_EXIT=$?

            if [ $CURL_EXIT -eq 0 ]; then
              echo "✓ API is ready after ${ELAPSED} seconds!"
              READY=true
              break
            fi

            # Show progress every 15 attempts (30 seconds)
            if [ $((ATTEMPT % 15)) -eq 0 ]; then
              echo "Still waiting... (${ELAPSED}s / 300s)"
              # Show container status periodically for debugging
              docker compose -f docker/docker-compose.test.yaml ps hauspet_api_test 2>/dev/null || true
            fi

            sleep 2
          done

          set -e  # Re-enable exit on error for the validation section

          if [ "$READY" != "true" ]; then
            echo ""
            echo "✗ API failed to start after 300 seconds"
            echo ""
            echo "=== CONTAINER STATUS ==="
            docker compose -f docker/docker-compose.test.yaml ps || echo "Failed to get container status"
            echo ""
            echo "=== FULL API LOGS ==="
            docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test || echo "Failed to get API logs"
            echo ""
            echo "=== DATABASE LOGS ==="
            docker compose -f docker/docker-compose.test.yaml logs hauspet_db_test || echo "Failed to get DB logs"
            exit 1
          fi

          echo ""
          echo "Verifying database has data..."
          BREEDS_RESPONSE=$(curl --connect-timeout 5 --max-time 10 -s http://localhost:3000/api/breeds)
          echo "API Response (first 200 chars): ${BREEDS_RESPONSE:0:200}"

          BREED_COUNT=$(echo "$BREEDS_RESPONSE" | grep -o '"id"' | wc -l | tr -d ' ')
          echo "Found $BREED_COUNT breeds in database"

          if [ "$BREED_COUNT" -lt 5 ]; then
            echo ""
            echo "ERROR: Database does not have enough seed data (expected at least 5 breeds)"
            echo ""
            echo "=== Full API Logs ==="
            docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test || echo "Failed to get API logs"
            exit 1
          fi

          echo "✓ Database verified with $BREED_COUNT breeds!"
          echo "✓ Ready to run functional tests!"

      - name: Run functional tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: hauspet_test_db
        run: npx playwright test tests/functional --grep-invert "should navigate pagination in UI|should filter and reset pagination|should display all breed types|should filter breeds by|should maintain filter when paginating|should reset to page 1 when changing filter|should search breeds by name|should combine search and type filter|should maintain filters when using browser back button|should clear search when clicking clear button|should show correct pagination info|should disable Previous button|should show all breeds when clicking All filter"

      - name: Stop test services
        if: always()
        run: docker compose -f docker/docker-compose.test.yaml down

      - name: Upload functional test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✅ All test suites completed!"
          echo "- Unit Tests: ${{ needs.unit-tests.result }}"
          echo "- Functional Tests: ${{ needs.functional-tests.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.functional-tests.result }}" != "success" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi

          echo "✅ All tests passed successfully!"
