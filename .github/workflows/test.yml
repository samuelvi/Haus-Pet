name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install API dependencies (outside container for speed)
        run: |
          echo "Installing API dependencies..."
          cd app/api
          npm ci --silent
          echo "✓ API dependencies installed"

      - name: Start database services
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_db_test hauspet_redis_test hauspet_audit_db_test

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for database to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.test.yaml ps | grep -q "hauspet_db_test.*healthy"; then
              echo "Database is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Database failed to become healthy"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_db_test
              exit 1
            fi
            echo "Database not ready, waiting... (Attempt $i/30)"
            sleep 2
          done

      - name: Setup database (generate, migrate, seed)
        run: |
          cd app/api
          echo "Generating Prisma client..."
          npx prisma generate
          echo "Running migrations..."
          DATABASE_URL="postgresql://user:password@localhost:5433/hauspet_test_db" npx prisma migrate deploy
          echo "Seeding database..."
          DATABASE_URL="postgresql://user:password@localhost:5433/hauspet_test_db" npx prisma db seed
          echo "Seeding pets read model..."
          DATABASE_URL="postgresql://user:password@localhost:5433/hauspet_test_db" npx ts-node prisma/seed-pets-readmodel.ts
          echo "✓ Database setup complete"

      - name: Start API service (with migrations)
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_api_test
          echo "Waiting 5 seconds for container to start..."
          sleep 5

      - name: Check API container is running
        run: |
          echo "=== Checking if API container started ==="
          CONTAINER_ID=$(docker compose -f docker/docker-compose.test.yaml ps -q hauspet_api_test)

          if [ -z "$CONTAINER_ID" ]; then
            echo "❌ ERROR: API container did not start!"
            echo "=== All containers status ==="
            docker compose -f docker/docker-compose.test.yaml ps
            echo "=== API Logs ==="
            docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test
            exit 1
          fi

          echo "✓ Container ID: $CONTAINER_ID"

          CONTAINER_STATE=$(docker inspect --format='{{.State.Status}}' $CONTAINER_ID)
          echo "Container state: $CONTAINER_STATE"

          if [ "$CONTAINER_STATE" != "running" ]; then
            echo "❌ ERROR: Container is not running (state: $CONTAINER_STATE)"
            echo "=== Container details ==="
            docker inspect $CONTAINER_ID
            echo "=== API Logs ==="
            docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test
            exit 1
          fi

          echo "✓ API container is running"

      - name: Show initial API logs
        run: |
          echo "Waiting 10 seconds for initialization to begin..."
          sleep 10
          echo "=== Initial API Logs ==="
          docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test | tail -100

      - name: Wait for API to be ready
        timeout-minutes: 6
        run: |
          set +e  # Don't exit on error
          echo "Starting wait loop..."
          attempt=0
          max_attempts=150

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))

            # Try curl - capture result but don't fail
            if curl --connect-timeout 3 --max-time 5 -f -s http://localhost:3000/api/breeds > /tmp/api_response.txt 2>&1; then
              echo "API responded!"

              # Check breed count - use || true to never fail
              breed_count=$(grep -o '"id"' /tmp/api_response.txt 2>/dev/null | wc -l | tr -d ' ' || echo "0")
              echo "Found $breed_count breeds"

              if [ "$breed_count" -ge 5 ]; then
                echo "SUCCESS: Database has $breed_count breeds!"
                exit 0
              else
                echo "WARNING: Only $breed_count breeds found (need 5+)"
              fi
            fi

            # Show progress and logs periodically
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "=== Attempt $attempt/$max_attempts - still waiting ==="
              echo "Container status:"
              docker compose -f docker/docker-compose.test.yaml ps hauspet_api_test 2>&1 || true
              echo "Latest API logs (last 20 lines):"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test 2>&1 | tail -20 || true
              echo "---"
            fi

            sleep 2
          done

          echo ""
          echo "FAILED: API never became ready after $max_attempts attempts"
          echo "=== API Logs ==="
          docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test 2>&1 | tail -100 || true
          exit 1

      - name: Run functional tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: hauspet_test_db
        run: npx playwright test tests/functional --grep-invert "should navigate pagination in UI|should filter and reset pagination|should display all breed types|should filter breeds by|should maintain filter when paginating|should reset to page 1 when changing filter|should search breeds by name|should combine search and type filter|should maintain filters when using browser back button|should clear search when clicking clear button|should show correct pagination info|should disable Previous button|should show all breeds when clicking All filter"

      - name: Stop test services
        if: always()
        run: docker compose -f docker/docker-compose.test.yaml down

      - name: Upload functional test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✅ All test suites completed!"
          echo "- Unit Tests: ${{ needs.unit-tests.result }}"
          echo "- Functional Tests: ${{ needs.functional-tests.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.functional-tests.result }}" != "success" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi

          echo "✅ All tests passed successfully!"
