name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start database services
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_db_test hauspet_redis_test hauspet_audit_db_test

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for database to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.test.yaml ps | grep -q "hauspet_db_test.*healthy"; then
              echo "Database is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Database failed to become healthy"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_db_test
              exit 1
            fi
            echo "Database not ready, waiting... (Attempt $i/30)"
            sleep 2
          done

      - name: Start API service (with migrations)
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_api_test

      - name: Check API container status
        run: |
          echo "Waiting 10 seconds for container to initialize..."
          sleep 10
          echo "=== Container Status ==="
          docker compose -f docker/docker-compose.test.yaml ps hauspet_api_test
          echo "=== Initial API Logs (first 100 lines) ==="
          docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test | head -100

      - name: Wait for API to be ready
        shell: bash
        run: |
          set -x  # Enable debug mode to see every command
          echo "=== Starting API Wait Loop ==="
          echo "Bash version: $BASH_VERSION"
          echo "Will wait up to 5 minutes for API to be ready"
          echo "Starting at: $(date)"

          attempt=0
          max_attempts=150

          while [ $attempt -lt $max_attempts ]; do
            attempt=$((attempt + 1))
            elapsed=$((attempt * 2))

            echo "Attempt ${attempt}/${max_attempts} (${elapsed}s elapsed)"

            # Try to reach the API
            if curl --connect-timeout 3 --max-time 5 -f -s http://localhost:3000/api/breeds > /dev/null 2>&1; then
              echo "✓ API is ready after ${elapsed} seconds!"
              echo ""
              echo "Verifying database has data..."
              response=$(curl -s http://localhost:3000/api/breeds)
              echo "API Response: ${response:0:200}"

              breed_count=$(echo "$response" | grep -o '"id"' | wc -l)
              echo "Found $breed_count breeds in database"

              if [ "$breed_count" -ge 5 ]; then
                echo "✓ Database verified with $breed_count breeds!"
                echo "✓ Ready to run functional tests!"
                exit 0
              else
                echo "ERROR: Database does not have enough seed data (expected at least 5 breeds)"
                docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test
                exit 1
              fi
            fi

            # Show progress every 10 attempts
            if [ $((attempt % 10)) -eq 0 ]; then
              echo "Still waiting... (${elapsed}s / 300s)"
              echo "Container status:"
              docker compose -f docker/docker-compose.test.yaml ps hauspet_api_test || echo "Failed to get container status"
            fi

            sleep 2
          done

          # If we get here, API never became ready
          echo ""
          echo "✗ API failed to start after 300 seconds"
          echo "Ended at: $(date)"
          echo ""
          echo "=== CONTAINER STATUS ==="
          docker compose -f docker/docker-compose.test.yaml ps
          echo ""
          echo "=== FULL API LOGS ==="
          docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test
          echo ""
          echo "=== DATABASE LOGS ==="
          docker compose -f docker/docker-compose.test.yaml logs hauspet_db_test
          exit 1

      - name: Run functional tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: hauspet_test_db
        run: npx playwright test tests/functional --grep-invert "should navigate pagination in UI|should filter and reset pagination|should display all breed types|should filter breeds by|should maintain filter when paginating|should reset to page 1 when changing filter|should search breeds by name|should combine search and type filter|should maintain filters when using browser back button|should clear search when clicking clear button|should show correct pagination info|should disable Previous button|should show all breeds when clicking All filter"

      - name: Stop test services
        if: always()
        run: docker compose -f docker/docker-compose.test.yaml down

      - name: Upload functional test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, functional-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✅ All test suites completed!"
          echo "- Unit Tests: ${{ needs.unit-tests.result }}"
          echo "- Functional Tests: ${{ needs.functional-tests.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.functional-tests.result }}" != "success" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi

          echo "✅ All tests passed successfully!"
