name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Generate coverage report
        run: npm run test:unit:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start database services
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_db_test hauspet_redis_test hauspet_audit_db_test

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for database to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.test.yaml ps | grep -q "hauspet_db_test.*healthy"; then
              echo "Database is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Database failed to become healthy"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_db_test
              exit 1
            fi
            echo "Database not ready, waiting... (Attempt $i/30)"
            sleep 2
          done

      - name: Start API service (with migrations)
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_api_test

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s -f -o /dev/null http://localhost:3000/api/breeds; then
              echo "API is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test
              exit 1
            fi
            echo "API not ready, waiting... (Attempt $i/30)"
            sleep 2
          done
          echo "Waiting additional 5 seconds for database seeding to complete..."
          sleep 5
          echo "Ready to run integration tests!"

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: hauspet_test_db
        run: npx playwright test tests/integration

      - name: Stop test services
        if: always()
        run: docker compose -f docker/docker-compose.test.yaml down

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-report
          path: playwright-report/
          retention-days: 7

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest
    needs: integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start database services
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_db_test hauspet_redis_test hauspet_audit_db_test

      - name: Wait for database to be healthy
        run: |
          echo "Waiting for database to be healthy..."
          for i in {1..30}; do
            if docker compose -f docker/docker-compose.test.yaml ps | grep -q "hauspet_db_test.*healthy"; then
              echo "Database is healthy!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "Database failed to become healthy"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_db_test
              exit 1
            fi
            echo "Database not ready, waiting... (Attempt $i/30)"
            sleep 2
          done

      - name: Start API service (with migrations)
        run: |
          docker compose -f docker/docker-compose.test.yaml up -d hauspet_api_test

      - name: Wait for API to be ready
        run: |
          echo "Waiting for API to be ready..."
          for i in {1..30}; do
            if curl -s -f -o /dev/null http://localhost:3000/api/breeds; then
              echo "API is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "API failed to start"
              docker compose -f docker/docker-compose.test.yaml logs hauspet_api_test
              exit 1
            fi
            echo "API not ready, waiting... (Attempt $i/30)"
            sleep 2
          done
          echo "Waiting additional 5 seconds for database seeding to complete..."
          sleep 5
          echo "Ready to run functional tests!"

      - name: Run functional tests
        env:
          DB_HOST: localhost
          DB_PORT: 5433
          DB_USER: user
          DB_PASSWORD: password
          DB_NAME: hauspet_test_db
        run: npx playwright test tests/functional

      - name: Stop test services
        if: always()
        run: docker compose -f docker/docker-compose.test.yaml down

      - name: Upload functional test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functional-test-report
          path: playwright-report/
          retention-days: 7

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, functional-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "✅ All test suites completed!"
          echo "- Unit Tests: ${{ needs.unit-tests.result }}"
          echo "- Integration Tests: ${{ needs.integration-tests.result }}"
          echo "- Functional Tests: ${{ needs.functional-tests.result }}"

          if [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.integration-tests.result }}" != "success" ]] || \
             [[ "${{ needs.functional-tests.result }}" != "success" ]]; then
            echo "❌ Some tests failed!"
            exit 1
          fi

          echo "✅ All tests passed successfully!"
