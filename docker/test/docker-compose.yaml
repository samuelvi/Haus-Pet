services:
  hauspet_api_test:
    build:
      context: ../../app/api
      dockerfile: ../../docker/test/Dockerfile
    depends_on:
      hauspet_db_test:
        condition: service_healthy
      hauspet_redis_test:
        condition: service_healthy
      hauspet_audit_db_test:
        condition: service_healthy
    container_name: hauspet_api_test
    working_dir: /app/api
    env_file:
      - ../../app/api/.env.test
    environment:
      # Override only the variables that need to be different in Docker
      - DATABASE_URL=postgresql://user:password@hauspet_db_test:5432/hauspet_test_db
      - DB_HOST=hauspet_db_test
      - DB_NAME=hauspet_test_db
      - REDIS_HOST=hauspet_redis_test
      - AUDIT_DB_URI=mongodb://audit_user:audit_pass@hauspet_audit_db_test:27017/audit_log_db?authSource=admin
    ports:
      - "3000:3000"
    volumes:
      - ../../app/api:/app/api
      - ../../tests:/app/tests
      - ../../playwright.config.ts:/app/playwright.config.ts
      - ../../package.json:/app/package.json
      - ../../package-lock.json:/app/package-lock.json
      - /app/api/node_modules
      - /app/node_modules
    command: sh -c "cd /app/api && npm install --silent && npx prisma generate && npx prisma migrate deploy && npx prisma db seed && npx ts-node prisma/seed-pets-readmodel.ts && cd /app && npm install --silent && cd /app/api && ./node_modules/.bin/ts-node index.ts"
    restart: unless-stopped
    networks:
      - hauspet-test-network

  hauspet_db_test:
    image: postgres:14-alpine
    container_name: hauspet_db_test
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=hauspet_test_db
    ports:
      - "5433:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d hauspet_test_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hauspet-test-network

  hauspet_audit_db_test:
    image: mongo:6.0
    container_name: hauspet_audit_db_test
    environment:
      - MONGO_INITDB_ROOT_USERNAME=audit_user
      - MONGO_INITDB_ROOT_PASSWORD=audit_pass
    ports:
      - "27018:27017"
    volumes:
      - ./mongo/data:/data/db
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hauspet-test-network

  hauspet_redis_test:
    image: redis:7-alpine
    container_name: hauspet_redis_test
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hauspet-test-network

networks:
  hauspet-test-network:
    driver: bridge
